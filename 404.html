<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Страница не найдена — dr.derekk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/dr.derekk/assets/styles/2188f60834e579a5.css">
  <link rel="stylesheet" href="/dr.derekk/assets/portable.css">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#522714;font:18px/1.5 sans-serif}main{max-width:40rem;padding:2rem;text-align:center}h1{font:normal 48px/1.1 serif}a{color:inherit}</style>
</head>
<body>
  <main><h1>Что-то пошло не так</h1><p>Не удалось найти нужную страницу.</p><p><a href="./" id="home">На главную</a></p></main>
  <script>
    // Find this static site's root even when GitHub serves this file for a
    // missing nested URL, then open the original downloaded /404/ page.
    (async () => {
      const parts = location.pathname.split('/').filter(Boolean);
      for (let depth = parts.length; depth >= 0; depth--) {
        const base = new URL('/' + parts.slice(0, depth).join('/') + (depth ? '/' : ''), location.origin);
        try {
          const response = await fetch(new URL('site-config.js', base), { cache: 'no-store' });
          if (!response.ok) continue;
          const text = await response.text();
          if (!/\b(?:window|globalThis)\.DR_DEREKK_CONFIG\s*=/.test(text)) continue;
          document.getElementById('home').href = base.href;
          location.replace(new URL('404/', base).href);
          return;
        } catch {}
      }
    })();
  </script>
</body>
</html>
