  <script>
    // Find this static site's root even when GitHub serves this file for a

    (async () => {
      const parts = location.pathname.split('/').filter(Boolean);
      for (let depth = parts.length; depth >= 0; depth--) {
        const base = new URL('/' + parts.slice(0, depth).join('/') + (depth ? '/' : ''), location.origin);

          const target = new URL('404/', base);
          if (target.pathname === location.pathname) break;
          target.search = location.search;
          target.hash = location.hash;
          location.replace(target.href);
          return;
        } catch {}
      }

      // Track this document only when there is no destination to open.
      const fallback = document.getElementById('metrika-404-fallback');
